apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: selfsigned
spec:
  selfSigned: {}
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: podinfo-tls
  namespace: podinfo
spec:
  secretName: podinfo-tls
  duration: 2160h
  renewBefore: 360h
  dnsNames: [podinfo.local]
  issuerRef:
    name: selfsigned
    kind: ClusterIssuer
