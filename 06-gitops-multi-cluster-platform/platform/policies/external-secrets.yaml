# Demo backend uses the "fake" provider so the flow runs on kind with no cloud account.
# For AWS swap the provider block for:
#   aws: { service: SecretsManager, region: ap-south-1, auth: { jwt: { serviceAccountRef: { name: eso, namespace: external-secrets } } } }
apiVersion: external-secrets.io/v1beta1
kind: ClusterSecretStore
metadata:
  name: demo-store
spec:
  provider:
    fake:
      data:
        - key: /podinfo/ui-message
          value: "Hello from the secret store"
---
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: podinfo-config
  namespace: podinfo
spec:
  refreshInterval: 1m
  secretStoreRef:
    kind: ClusterSecretStore
    name: demo-store
  target:
    name: podinfo-config
  data:
    - secretKey: PODINFO_UI_MESSAGE
      remoteRef:
        key: /podinfo/ui-message
