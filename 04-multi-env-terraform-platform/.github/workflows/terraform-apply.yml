name: terraform-apply
on:
  push:
    branches: [main]
    paths: ["envs/**", "modules/**"]
permissions:
  id-token: write
  contents: read
concurrency:
  group: terraform-apply
  cancel-in-progress: false
jobs:
  dev:
    uses: ./.github/workflows/_apply.yml
    with:
      env: dev
  staging:
    needs: dev
    uses: ./.github/workflows/_apply.yml
    with:
      env: staging
  prod:
    needs: staging
    uses: ./.github/workflows/_apply.yml
    with:
      env: prod
